<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="diyaGold" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFD269" />
      <stop offset="40%" stop-color="#E58E26" />
      <stop offset="100%" stop-color="#7B341E" />
    </radialGradient>
    <radialGradient id="flameInner" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF48F" />
      <stop offset="60%" stop-color="#FF9F1A" />
      <stop offset="100%" stop-color="#FF3838" />
    </radialGradient>
    <radialGradient id="diyaGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFA834" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF6B6B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFA834" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Flame Glow -->
  <circle cx="100" cy="70" r="55" fill="url(#diyaGlow)" class="diya-aura"/>

  <!-- Flame Shape -->
  <path class="diya-flame" d="M 100,25 C 115,50 120,70 100,92 C 80,70 85,50 100,25 Z" fill="url(#flameInner)" />
  <path class="diya-flame-core" d="M 100,45 C 108,60 110,75 100,88 C 90,75 92,60 100,45 Z" fill="#FFFDF0" />

  <!-- Diya Clay / Brass Lamp Base -->
  <!-- Rim -->
  <ellipse cx="100" cy="115" rx="55" ry="18" fill="#D35400" />
  <ellipse cx="100" cy="112" rx="50" ry="14" fill="url(#diyaGold)" />
  <ellipse cx="100" cy="111" rx="42" ry="10" fill="#962D00" />
  <!-- Oil puddle with reflection -->
  <ellipse cx="100" cy="111" rx="35" ry="7" fill="#E67E22" />

  <!-- Body -->
  <path d="M 45,115 C 48,150 70,168 100,168 C 130,168 152,150 155,115 C 135,130 65,130 45,115 Z" fill="url(#diyaGold)" />

  <!-- Decorative engravings on Diya -->
  <path d="M 60,130 Q 100,152 140,130" fill="none" stroke="#FFD269" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="142" r="2.5" fill="#FFF" />
  <circle cx="100" cy="146" r="3" fill="#FFF" />
  <circle cx="120" cy="142" r="2.5" fill="#FFF" />

  <!-- Base Stand -->
  <ellipse cx="100" cy="168" rx="28" ry="8" fill="#7B341E" />
  <ellipse cx="100" cy="166" rx="24" ry="6" fill="#B33925" />
</svg>
