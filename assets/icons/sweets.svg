<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="ladooGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FF9F1A" />
      <stop offset="100%" stop-color="#C44500" />
    </radialGradient>
    <linearGradient id="silverFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#ECEFF1" />
      <stop offset="70%" stop-color="#CFD8DC" />
      <stop offset="100%" stop-color="#B0BEC5" />
    </linearGradient>
    <linearGradient id="kajuBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="100%" stop-color="#EED9AC" />
    </linearGradient>
  </defs>

  <!-- Sweet Bowl / Dish -->
  <ellipse cx="80" cy="110" rx="65" ry="24" fill="#C5A059" opacity="0.4" />
  <ellipse cx="80" cy="105" rx="60" ry="20" fill="#E6C875" />
  <ellipse cx="80" cy="103" rx="54" ry="16" fill="#FFF3CD" />

  <!-- Kaju Katli 1 -->
  <polygon points="45,95 65,80 85,95 65,110" fill="url(#kajuBase)" stroke="#D4AF37" stroke-width="1"/>
  <polygon points="48,94 65,82 82,94 65,106" fill="url(#silverFoil)" opacity="0.85"/>

  <!-- Kaju Katli 2 -->
  <polygon points="75,95 95,80 115,95 95,110" fill="url(#kajuBase)" stroke="#D4AF37" stroke-width="1"/>
  <polygon points="78,94 95,82 112,94 95,106" fill="url(#silverFoil)" opacity="0.85"/>

  <!-- Motichoor Ladoo -->
  <circle cx="80" cy="72" r="22" fill="url(#ladooGrad)" filter="drop-shadow(0px 3px 4px rgba(0,0,0,0.2))"/>
  <!-- Pistachio/Cardamom sprinkles on Ladoo -->
  <circle cx="75" cy="65" r="2" fill="#2ED573" />
  <circle cx="84" cy="68" r="1.5" fill="#2ED573" />
  <circle cx="78" cy="76" r="2" fill="#A4B0BE" />
  <circle cx="88" cy="74" r="1.5" fill="#FFEAA7" />
  <circle cx="71" cy="73" r="1.5" fill="#2ED573" />
</svg>
